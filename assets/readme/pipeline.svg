<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="320" viewBox="0 0 1200 320"
     role="img" aria-labelledby="pipe-title pipe-desc">
  <title id="pipe-title">yk-lens-vector-ts 工作机制</title>
  <desc id="pipe-desc">把已确认的笔记变成可搜的向量：上游服务写入成功后触发 replace，heading_recursive 切块，qwen3-embedding 生成文本与图像双空间向量，写入 LanceDB，提供 IVF_FLAT + cosine 向量搜索。</desc>

  <rect width="1200" height="320" rx="24" fill="#0B0F16"/>

  <text x="56" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="17" letter-spacing="2" fill="#7C8CA3">HOW IT WORKS</text>
  <text x="56" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif"
        font-size="24" font-weight="600" fill="#E7EDF4">笔记 → 可搜向量</text>

  <!-- Step cards -->
  <g transform="translate(56 96)">
    <!-- card 1 -->
    <g transform="translate(0 0)">
      <rect width="232" height="150" rx="14" fill="#111A29" stroke="#1E2A3D"/>
      <text x="22" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="14" fill="#5B6B82">STEP 01</text>
      <text x="22" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="22" font-weight="600" fill="#E7EDF4">upstream</text>
      <text x="22" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif"
            font-size="17" fill="#B8C4D4">笔记确认写入 vault</text>
      <text x="22" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="15" fill="#7C8CA3">POST /v1/index/replace</text>
    </g>
    <!-- arrow -->
    <g transform="translate(240 66)">
      <line x1="0" y1="8" x2="40" y2="8" stroke="#4C7DF5" stroke-width="2"/>
      <polygon points="40,2 50,8 40,14" fill="#4C7DF5"/>
    </g>

    <!-- card 2 -->
    <g transform="translate(253 0)">
      <rect width="232" height="150" rx="14" fill="#111A29" stroke="#1E2A3D"/>
      <text x="22" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="14" fill="#5B6B82">STEP 02</text>
      <text x="22" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="22" font-weight="600" fill="#E7EDF4">chunk</text>
      <text x="22" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif"
            font-size="17" fill="#B8C4D4">heading_recursive 切块</text>
      <text x="22" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="15" fill="#7C8CA3">max 512 tok · overlap 64</text>
    </g>
    <!-- arrow -->
    <g transform="translate(493 66)">
      <line x1="0" y1="8" x2="40" y2="8" stroke="#4C7DF5" stroke-width="2"/>
      <polygon points="40,2 50,8 40,14" fill="#4C7DF5"/>
    </g>

    <!-- card 3 -->
    <g transform="translate(506 0)">
      <rect width="232" height="150" rx="14" fill="#111A29" stroke="#1E2A3D"/>
      <text x="22" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="14" fill="#5B6B82">STEP 03</text>
      <text x="22" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="22" font-weight="600" fill="#E7EDF4">embed</text>
      <text x="22" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif"
            font-size="17" fill="#B8C4D4">qwen3-embedding</text>
      <text x="22" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="15" fill="#7C8CA3">text / image 双空间</text>
    </g>
    <!-- arrow -->
    <g transform="translate(746 66)">
      <line x1="0" y1="8" x2="40" y2="8" stroke="#4C7DF5" stroke-width="2"/>
      <polygon points="40,2 50,8 40,14" fill="#4C7DF5"/>
    </g>

    <!-- card 4 -->
    <g transform="translate(759 0)">
      <rect width="232" height="150" rx="14" fill="#111A29" stroke="#1E2A3D"/>
      <text x="22" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="14" fill="#5B6B82">STEP 04</text>
      <text x="22" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="22" font-weight="600" fill="#E7EDF4">lance</text>
      <text x="22" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif"
            font-size="17" fill="#B8C4D4">IVF_FLAT + cosine</text>
      <text x="22" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="15" fill="#7C8CA3">启动只 Open，不 re-embed</text>
    </g>
  </g>

  <!-- note bar -->
  <g transform="translate(56 262)">
    <rect width="1088" height="40" rx="10" fill="#0E1622" stroke="#1A2536"/>
    <rect x="20" y="13" width="10" height="10" rx="2" fill="#3ECF8E"/>
    <text x="40" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" fill="#93A1B4">同一 doc_id 且 content_hash 未变 → skip，不重复切分 / embed（省钱）</text>
  </g>
</svg>

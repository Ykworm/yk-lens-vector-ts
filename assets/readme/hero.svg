<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">yk-lens-vector-ts</title>
  <desc id="hero-desc">yk-lens 的向量服务：把 vault 里的正式笔记切块、embedding 后写入 Lance 原生目录，提供向量搜索。文本与图像双空间，IVF_FLAT + cosine。</desc>

  <rect width="1200" height="380" rx="24" fill="#0B0F16"/>

  <!-- ================= Title block ================= -->
  <g id="title-block" transform="translate(60 46)">
    <!-- motif: chunk squares -->
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#4C7DF5"/>
    <text x="22" y="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19" letter-spacing="2.5" fill="#7C8CA3">VECTOR SEARCH SERVICE</text>

    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif"
          font-size="56" font-weight="700" fill="#EAF0F8">yk-lens-vector-ts</text>

    <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif"
          font-size="27" fill="#B8C4D4">把笔记变成可搜的向量</text>
    <text x="0" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif"
          font-size="27" fill="#B8C4D4">切块 <tspan fill="#4C7DF5" font-weight="600">→</tspan> embedding <tspan fill="#4C7DF5" font-weight="600">→</tspan> Lance <tspan fill="#4C7DF5" font-weight="600">→</tspan> 向量搜索</text>

    <line x1="0" y1="186" x2="520" y2="186" stroke="#1E2A3D"/>

    <text x="0" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="17" fill="#7C8CA3">Node ≥ 20 · HTTP :8703 · @lancedb/lancedb</text>
    <text x="0" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="17" fill="#7C8CA3">doc_id 稳定主键 · 供上游服务调用</text>
  </g>

  <!-- ================= Proof: Lance store + search ================= -->
  <g id="project-proof" transform="translate(640 48)">
    <rect width="500" height="284" rx="16" fill="#111A29" stroke="#1E2A3D"/>

    <!-- card header -->
    <text x="24" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#7C8CA3">LANCE STORE</text>
    <text x="24" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" fill="#5B6B82">:8703</text>
    <circle cx="470" cy="26" r="5" fill="#3ECF8E"/>

    <!-- chunk stream -->
    <text x="24" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" fill="#B8C4D4">chunk</text>
    <rect x="78" y="78" width="24" height="14" rx="3" fill="#4C7DF5" opacity="0.9"/>
    <rect x="106" y="78" width="24" height="14" rx="3" fill="#4C7DF5" opacity="0.9"/>
    <rect x="134" y="78" width="24" height="14" rx="3" fill="#4C7DF5" opacity="0.9"/>
    <rect x="162" y="78" width="24" height="14" rx="3" fill="#4C7DF5" opacity="0.9"/>
    <text x="200" y="91" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#4C7DF5" font-weight="600">→</text>
    <text x="218" y="91" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" fill="#B8C4D4">qwen3-embedding</text>

    <line x1="24" y1="110" x2="476" y2="110" stroke="#1A2536"/>

    <!-- table header -->
    <text x="24" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" fill="#5B6B82">doc_id</text>
    <text x="150" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" fill="#5B6B82">title</text>
    <text x="476" y="134" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" fill="#5B6B82">vector</text>

    <!-- row 1 -->
    <text x="24" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#C7D2E0">01HQ9A3K</text>
    <text x="150" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif"
          font-size="16" fill="#C7D2E0">混合检索笔记</text>
    <text x="476" y="162" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#7C8CA3">text_vector</text>

    <!-- row 2 : hit -->
    <rect x="12" y="176" width="476" height="30" rx="6" fill="#4C7DF5" fill-opacity="0.16" stroke="#4C7DF5"/>
    <text x="24" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#EAF0F8">01HQ9A3K</text>
    <text x="150" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif"
          font-size="16" fill="#EAF0F8">图像与文本</text>
    <text x="476" y="196" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#4C7DF5">image_vector</text>

    <!-- row 3 -->
    <text x="24" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#C7D2E0">01HQ9B2C</text>
    <text x="150" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif"
          font-size="16" fill="#C7D2E0">Lance 用法</text>
    <text x="476" y="226" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#7C8CA3">text_vector</text>

    <line x1="24" y1="244" x2="476" y2="244" stroke="#1A2536"/>

    <!-- footer -->
    <text x="24" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#7C8CA3">search: 混合检索</text>
    <text x="476" y="270" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#3ECF8E">命中 · cosine 0.91</text>
  </g>
</svg>
